<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Sistem Loket Antrian</title>
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-screen bg-background text-on-background flex">
  <section class="hidden lg:flex w-1/2 bg-primary-container text-on-primary relative overflow-hidden p-16 flex-col justify-between">
    <div>
      <div class="flex items-center gap-4">
        <img id="instansi-logo" class="w-24 object-contain rounded hidden" alt="Logo instansi" />
        <h1 id="instansi-title" class="text-5xl font-extrabold leading-tight">Sistem Loket Web</h1>
      </div>
      <p id="instansi-tagline" class="mt-4 text-on-primary-container max-w-md">Sistem antrian terpadu untuk pelayanan loket.</p>
    </div>
    <div class="grid grid-cols-3 gap-4 max-w-lg">
      <div class="bg-white/10 rounded-xl p-4"><p class="text-sm opacity-70">Jalur</p><p id="badge-jalur" class="text-2xl font-bold">...</p></div>
      <div class="bg-white/10 rounded-xl p-4"><p class="text-sm opacity-70">Loket</p><p id="badge-loket" class="text-2xl font-bold">...</p></div>
      <div class="bg-white/10 rounded-xl p-4"><p class="text-sm opacity-70">Realtime</p><p class="text-2xl font-bold">Live</p></div>
    </div>
    <div class="absolute -right-20 -bottom-20 w-80 h-80 rounded-full bg-secondary-container/20"></div>
  </section>
  <section class="flex-1 flex items-center justify-center p-6">
    <form id="login-form" class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-8 sleek-shadow">
      <p class="font-tech text-xs tracking-[0.18em] text-secondary uppercase">Portal Petugas</p>
      <h2 class="text-3xl font-bold text-primary mt-2 mb-1">Masuk</h2>
      <p class="text-on-surface-variant mb-8">Masukan username dan password untuk login akun.</p>
      <label class="block font-semibold text-sm mb-2">Username</label>
      <input name="username" class="w-full mb-5 rounded-lg bg-[#edf2f7] border border-outline-variant px-4 py-3 outline-none focus:border-[#00A4E4] focus:ring-2 focus:ring-[#00A4E4]/20" placeholder="Masukkan username" required autocomplete="username" />
      <label class="block font-semibold text-sm mb-2">Password</label>
      <input name="password" type="password" class="w-full mb-6 rounded-lg bg-[#edf2f7] border border-outline-variant px-4 py-3 outline-none focus:border-[#00A4E4] focus:ring-2 focus:ring-[#00A4E4]/20" placeholder="Masukkan password" required autocomplete="current-password" />
      <p id="login-error" class="hidden text-error text-sm mb-4"></p>
      <button class="w-full bg-[#00A4E4] text-white font-semibold py-3 rounded-lg hover:bg-[#008bc2] transition">Masuk</button>
    </form>
  </section>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
